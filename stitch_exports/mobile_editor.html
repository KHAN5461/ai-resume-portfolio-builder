<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Portfolio Editor Workspace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-tint": "#00696e",
                      "secondary-fixed": "#ebdcff",
                      "on-primary-fixed-variant": "#004f53",
                      "surface-dim": "#dcd9d9",
                      "primary-container": "#00c4cc",
                      "secondary-container": "#8b3dff",
                      "surface-variant": "#e5e2e1",
                      "outline-variant": "#bbc9ca",
                      "inverse-on-surface": "#f3f0ef",
                      "surface-container-highest": "#e5e2e1",
                      "on-tertiary-fixed-variant": "#890063",
                      "on-primary-container": "#004c4f",
                      "primary-fixed-dim": "#3cdae2",
                      "on-surface-variant": "#3c494a",
                      "primary-fixed": "#63f7ff",
                      "on-secondary-fixed-variant": "#5d00c2",
                      "on-error": "#ffffff",
                      "error-container": "#ffdad6",
                      "surface-container": "#f0eded",
                      "inverse-surface": "#303030",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#3cdae2",
                      "on-secondary-fixed": "#270058",
                      "surface": "#fcf9f8",
                      "surface-container-low": "#f6f3f2",
                      "surface-bright": "#fcf9f8",
                      "error": "#ba1a1a",
                      "on-tertiary-fixed": "#3c0029",
                      "secondary": "#710fe5",
                      "on-primary": "#ffffff",
                      "surface-container-high": "#eae7e7",
                      "on-background": "#1b1b1c",
                      "on-secondary": "#ffffff",
                      "primary": "#00696e",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-container": "#ff8acc",
                      "outline": "#6c7a7a",
                      "background": "#fcf9f8",
                      "on-tertiary-container": "#84005f",
                      "on-primary-fixed": "#002021",
                      "tertiary-fixed": "#ffd8e9",
                      "on-secondary-container": "#faf1ff",
                      "on-error-container": "#93000a",
                      "on-surface": "#1b1b1c",
                      "secondary-fixed-dim": "#d4bbff",
                      "tertiary-fixed-dim": "#ffaed8",
                      "tertiary": "#ad1d7f"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "48px",
                      "md": "16px",
                      "gutter": "16px",
                      "container-margin": "24px",
                      "sm": "8px",
                      "xs": "4px",
                      "lg": "24px",
                      "base": "4px"
              },
              "fontFamily": {
                      "label-sm": ["Inter"],
                      "headline-xl": ["Plus Jakarta Sans"],
                      "label-md": ["Inter"],
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "body-md": ["Inter"],
                      "body-sm": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "500"}],
                      "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                      "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                      "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
              }
            },
          }
        }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<script>
    function toggleView(view) {
        document.getElementById('builder-view').classList.toggle('hidden', view !== 'builder');
        document.getElementById('preview-view').classList.toggle('hidden', view !== 'preview');
        
        document.getElementById('btn-builder').classList.toggle('bg-primary-container', view === 'builder');
        document.getElementById('btn-builder').classList.toggle('text-on-primary-container', view === 'builder');
        document.getElementById('btn-builder').classList.toggle('text-on-surface-variant', view !== 'builder');
        
        document.getElementById('btn-preview').classList.toggle('bg-primary-container', view === 'preview');
        document.getElementById('btn-preview').classList.toggle('text-on-primary-container', view === 'preview');
        document.getElementById('btn-preview').classList.toggle('text-on-surface-variant', view !== 'preview');
    }
  </script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden relative">
<!-- Simple Header -->
<header class="w-full z-50 bg-surface shadow-sm">
<div class="flex justify-between items-center h-16 px-gutter mx-auto w-full max-w-4xl">
<button class="flex items-center justify-center p-sm rounded-full hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex items-center gap-md">
<button class="bg-primary text-on-primary rounded-full px-lg py-sm font-label-md text-label-md shadow-sm transition-transform active:scale-95 hover:shadow-md">Publish</button>
</div>
</div>
</header>
<!-- Pill Tab Switcher -->
<div class="w-full bg-surface py-sm px-gutter flex justify-center z-40">
<div class="flex bg-surface-variant/30 rounded-full p-xs gap-xs border border-outline-variant/20">
<button class="px-lg py-sm rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container transition-colors" id="btn-builder" onclick="toggleView('builder')">Builder</button>
<button class="px-lg py-sm rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant/50 transition-colors" id="btn-preview" onclick="toggleView('preview')">Preview</button>
</div>
</div>
<!-- Main Scrollable Area -->
<main class="flex-1 flex flex-col w-full max-w-4xl mx-auto overflow-y-auto pb-24 px-gutter">
<!-- Builder View -->
<div class="flex flex-col space-y-xl pt-lg pb-xl" id="builder-view">
<!-- Section: Typography -->
<section>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md uppercase tracking-wider">Heading Content</h3>
<div class="space-y-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Title</label>
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl p-md font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-surface transition-colors text-on-surface" type="text" value="Jane Doe - Creative Director"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs">Subtitle</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant/30 rounded-xl p-md font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-surface transition-colors resize-none text-on-surface" rows="3">Crafting digital experiences that matter.</textarea>
</div>
</div>
</section>
<!-- Section: Media -->
<section>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md uppercase tracking-wider">Hero Image</h3>
<div class="border-2 border-dashed border-outline-variant/50 rounded-2xl p-xl flex flex-col items-center justify-center bg-surface-container-lowest hover:border-primary cursor-pointer transition-colors group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary mb-sm text-4xl">image</span>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary">Replace Image</span>
</div>
</section>
<!-- Section: Layout Blocks -->
<section>
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md uppercase tracking-wider">Add Elements</h3>
<div class="grid grid-cols-2 gap-md">
<button class="bg-surface-container-lowest shadow-sm rounded-2xl p-md flex flex-col items-center justify-center gap-sm hover:shadow-md transition-shadow border border-outline-variant/20 text-on-surface h-32">
<span class="material-symbols-outlined text-3xl text-primary">text_fields</span>
<span class="font-label-md text-label-md">Text Block</span>
</button>
<button class="bg-surface-container-lowest shadow-sm rounded-2xl p-md flex flex-col items-center justify-center gap-sm hover:shadow-md transition-shadow border border-outline-variant/20 text-on-surface h-32">
<span class="material-symbols-outlined text-3xl text-secondary">grid_view</span>
<span class="font-label-md text-label-md">Gallery</span>
</button>
</div>
</section>
</div>
<!-- Preview View -->
<div class="hidden flex-col items-center pt-lg pb-xl w-full" id="preview-view">
<!-- The 'Page' -->
<div class="bg-surface w-full flex-1 rounded-3xl shadow-md overflow-hidden border border-outline-variant/20 flex flex-col">
<div class="relative h-64 bg-surface-container-highest">
<img class="w-full h-full object-cover opacity-80" data-alt="A wide hero image showing a clean, modern workspace with a laptop, notebook, and a small potted plant on a light wooden desk, bathed in soft natural morning light." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBeg3eptM-SBeuJxl1kBiDlor6ecKb1QUMieFGoqQYZIs8YFnOW8inWCZlerwtf91Ag4XFUPZHf5QUuLeYoNlt8FJRRoSo0xkuH-TyURQJMPmBbEmA8-NQLGm6lwydbkR9YgeYs8sj3gh6muYB4l2vZSmALrES4vT_DU8bbvWtcl-QHVmcz2iGGl7gIfuljw4P29bsVJ8cbgI9emdNJO1OStXZqBL1JyfU7zbV1IdWk2jlubt8ILjzt"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
<div class="absolute bottom-lg left-lg right-lg">
<h1 class="font-headline-lg-mobile md:font-headline-xl text-headline-lg-mobile md:text-headline-xl text-on-surface mb-xs drop-shadow-sm">Jane Doe - Creative Director</h1>
<p class="font-body-md md:font-body-lg text-body-md md:text-body-lg text-on-surface-variant font-medium">Crafting digital experiences that matter.</p>
</div>
</div>
<div class="p-lg md:p-xl flex-1 bg-surface">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="bg-surface-container-lowest rounded-2xl p-lg shadow-sm border border-outline-variant/20">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-md">
<span class="material-symbols-outlined">design_services</span>
</div>
<h3 class="font-headline-md text-headline-md mb-sm">UI/UX Design</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Building intuitive and beautiful interfaces.</p>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-lg shadow-sm border border-outline-variant/20">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 text-secondary flex items-center justify-center mb-md">
<span class="material-symbols-outlined">branding_watermark</span>
</div>
<h3 class="font-headline-md text-headline-md mb-sm">Brand Identity</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Creating cohesive brand stories.</p>
</div>
</div>
</div>
</div>
</div>
</main>
<!-- Floating AI Studio Bottom Bar -->
<div class="fixed bottom-lg left-1/2 -translate-x-1/2 z-50">
<div class="bg-surface-container-high/90 backdrop-blur-md border border-outline-variant/30 rounded-full shadow-lg p-sm flex items-center gap-sm">
<button class="bg-primary text-on-primary rounded-full px-lg py-sm font-label-md text-label-md hover:bg-primary/90 transition-colors flex items-center gap-sm shadow-sm">
<span class="material-symbols-outlined text-sm">magic_button</span>
            AI Enhance
        </button>
<div class="w-px h-6 bg-outline-variant/40"></div>
<button aria-label="Undo" class="text-on-surface-variant hover:text-primary hover:bg-surface-variant/50 rounded-full p-sm transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">undo</span>
</button>
<button aria-label="Redo" class="text-on-surface-variant hover:text-primary hover:bg-surface-variant/50 rounded-full p-sm transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">redo</span>
</button>
<div class="w-px h-6 bg-outline-variant/40"></div>
<button aria-label="More options" class="text-on-surface-variant hover:bg-surface-variant/50 rounded-full p-sm transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</body></html>
