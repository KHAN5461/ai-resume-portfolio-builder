<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard for environments where window.fetch has only a getter.
      // Defines both getter and setter so libraries/polyfills assigning window.fetch do not throw:
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' ? window.fetch : null;
          var _currFetch = _origFetch;
          if (_origFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _currFetch; },
              set: function(val) { _currFetch = val; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore if descriptor cannot be modified
        }
      })();
    </script>
